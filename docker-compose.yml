version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cerbyd_postgres
    environment:
      POSTGRES_DB: cerbyd_triplogger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: x836vzm7dI
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cerbyd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cerbyd_triplogger"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: cerbyd_api
    environment:
      DB_NAME: cerbyd_triplogger
      DB_USER: postgres
      DB_PASSWORD: x836vzm7dI
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cerbyd_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"

  ingestion:
    build:
      context: .
      dockerfile: Ingestion/Dockerfile
    container_name: cerbyd_ingestion
    environment:
      DB_NAME: cerbyd_triplogger
      DB_USER: postgres
      DB_PASSWORD: x836vzm7dI
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cerbyd_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ingestion"

  data_processor:
    build:
      context: .
      dockerfile: DB/Dockerfile
    container_name: cerbyd_processor
    environment:
      DB_NAME: cerbyd_triplogger
      DB_USER: postgres
      DB_PASSWORD: x836vzm7dI
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cerbyd_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=data_processor"

  prometheus:
    image: prom/prometheus:latest
    container_name: cerbyd_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - cerbyd_network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: cerbyd_loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cerbyd_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: cerbyd_promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cerbyd_network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: cerbyd_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "9095:9095"
    networks:
      - cerbyd_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cerbyd_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - cerbyd_network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cerbyd_network:
    driver: bridge